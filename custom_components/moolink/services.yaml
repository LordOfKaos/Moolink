start_climate:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: moolink
    temperature:
      selector:
        number:
          min: 16
          max: 90
          step: 0.5
          mode: box
    duration:
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min
    defrost:
      selector:
        boolean:
    climate:
      selector:
        boolean:
    heating:
      selector:
        number:
          min: 0
          max: 4
          mode: box
    front_left_seat: &seat
      selector:
        number:
          min: 0
          max: 8
          mode: box
    front_right_seat: *seat
    rear_left_seat: *seat
    rear_right_seat: *seat
    steering_wheel:
      selector:
        number:
          min: 0
          max: 3
          mode: box

force_refresh:
  fields:
    device_id:
      selector:
        device:
          integration: moolink

set_charge_limits:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: moolink
    ac_limit: &limit
      required: true
      selector:
        number:
          min: 50
          max: 100
          step: 10
          unit_of_measurement: "%"
    dc_limit: *limit
