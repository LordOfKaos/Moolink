blueprint:
  name: Moolink - charging finished or battery reached a level
  description: >-
    Run your actions when the car stops charging, or when its battery rises
    above a level you choose. The trigger id is "finished" or "level", so
    your actions can tell them apart.
  domain: automation
  author: Moolink
  source_url: https://github.com/LordOfKaos/Moolink/blob/main/blueprints/automation/moolink/charging_finished.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    charging_sensor:
      name: Charging sensor
      selector:
        entity:
          domain: binary_sensor
          device_class: battery_charging
          integration: moolink
    battery_sensor:
      name: EV battery
      selector:
        entity:
          domain: sensor
          device_class: battery
          integration: moolink
    battery_level:
      name: Battery level
      description: Also act when the battery rises above this level.
      default: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    actions:
      name: Do
      description: For example, send a notification to your phone.
      selector:
        action:

mode: queued

triggers:
  - trigger: state
    entity_id: !input charging_sensor
    from: "on"
    to: "off"
    id: finished
  - trigger: numeric_state
    entity_id: !input battery_sensor
    above: !input battery_level
    id: level

actions:
  - choose: []
    default: !input actions
